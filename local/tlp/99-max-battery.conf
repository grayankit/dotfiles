# Max battery plan — TLP power-saver only.
# Installed to /etc/tlp.d/ by ~/.config/scripts/battery-plan.sh
#
# AC and BAT values are set so leaving this plan (Balanced / Performance)
# restores turbo and removes the perf cap. power-saver is the only profile
# that is actually limited.

CPU_ENERGY_PERF_POLICY_ON_SAV=power
CPU_SCALING_GOVERNOR_ON_SAV=powersave

# Percent of max turbo. 40 on this Ultra 5 125H is about 1.8 GHz.
# Raise CPU_MAX_PERF_ON_SAV if that feels too slow, then re-apply Max battery.
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=100
CPU_MIN_PERF_ON_SAV=0
CPU_MAX_PERF_ON_SAV=40

CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0

CPU_HWP_DYN_BOOST_ON_SAV=0

PCIE_ASPM_ON_SAV=powersave
WIFI_PWR_ON_SAV=on

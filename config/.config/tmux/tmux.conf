set -as terminal-features ",wezterm*:RGB"
set -g default-terminal "screen-256color"
set -as terminal-overrides ',xterm-256color:Tc'
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
set -g base-index 1
set -g renumber-windows on
set -g mouse on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-sesible'
set -g @plugin 'catppuccin/tmux#v2.3.0' # See https://github.com/catppuccin/tmux/tags for additional tags
set -g @plugin 'omerxx/tmux-sessionx'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'              # Automatically restore tmux sessions
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_session}"

#vim mode
setw -g mode-keys vi

#sessionx
set -g @sessionx-bind 'o'

run '~/.tmux/plugins/tpm/tpm'

